<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpringGalaxy</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #04060e;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #cfe3ff;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #stage canvas {
      display: block;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #hud-level {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9fb6d8;
      text-shadow: 0 0 12px rgba(60, 120, 255, 0.35);
    }
    #btn-back {
      pointer-events: auto;
      background: rgba(20, 32, 56, 0.6);
      border: 1px solid #35506e;
      color: #cfe3ff;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #btn-back:hover {
      background: rgba(40, 64, 112, 0.7);
    }
    #hud-hint {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: #6f87ad;
      letter-spacing: 1px;
    }
    #hud-selected {
      position: absolute;
      bottom: 40px;
      left: 12px;
      font-size: 15px;
      color: #e8f2ff;
      text-shadow: 0 0 10px rgba(80, 140, 255, 0.5);
      opacity: 0;
      transition: opacity 0.3s;
    }
    #hud-selected.on {
      opacity: 1;
    }
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 6, 14, 0.7);
      z-index: 20;
      color: #9fb6d8;
      font-size: 14px;
      letter-spacing: 2px;
    }
    #loader.on {
      display: flex;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/three/three.module.js"
      }
    }
  </script>
</head>

<body>
  <div id="stage"></div>
  <div id="hud">
    <div id="hud-top">
      <div id="hud-level">SpringGalaxy</div>
      <button id="btn-back">← назад</button>
    </div>
    <div id="hud-selected"></div>
    <div id="hud-hint"></div>
  </div>
  <div id="loader">Загрузка…</div>
  <script type="module" src="/js/main.js"></script>
</body>

</html>
